[project]
name = "naengo-ai"
version = "0.1.0"
description = "냉고 AI 서버(LangGraph) — 밖에 열지 않고 Spring에서만 호출을 받는 내부 서버"
authors = [
    { name = "yschoi9733", email = "129668673+yschoi9733@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E·F(기본) + import 정렬(I) + 흔한 버그(B) + 새 문법(UP) + async 안의 막는 호출(ASYNC)
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
